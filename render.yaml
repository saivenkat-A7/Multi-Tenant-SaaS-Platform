# ================================================================
# render.yaml — Render Blueprint for Multi-Tenant SaaS Platform
# ================================================================

databases:
  - name: saas-db
    databaseName: saas_db
    user: saas_user
    plan: free
    region: oregon
    postgresMajorVersion: 15

services:
  - type: web
    name: saas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: saas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: saas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: saas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: saas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: saas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: saas-frontend
          type: web
          property: host

  - type: web
    name: saas-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    plan: free

    buildArgs:
      - key: VITE_API_URL
        fromService:
          name: saas-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    
    envVars:
      - key: VITE_API_URL
        fromService:
          name: saas-backend
          type: web
          property: host
